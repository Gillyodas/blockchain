version: '3.8'

services:
  besu-node:
    image: hyperledger/besu:latest
    container_name: chaindegree-besu
    
    ports:
      - "8545:8545"   # HTTP JSON-RPC (app .NET gọi vào đây)
      - "8546:8546"   # WebSocket (optional)
    
    volumes:
      # Genesis config - READ ONLY (:ro)
      # Tại sao :ro: Besu không nên modify genesis file
      - ./besu/config/genesis.json:/config/genesis.json:ro
      
      # Data directory - READ WRITE
      # Nơi Besu lưu blockchain state
      - besu-data:/opt/besu/data
    
    command:
      # Genesis file
      - --genesis-file=/config/genesis.json
      
      # JSON-RPC HTTP API (app .NET gọi vào)
      - --rpc-http-enabled
      - --rpc-http-api=ETH,NET,IBFT,WEB3,ADMIN,TXPOOL
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      
      # JSON-RPC WebSocket (optional)
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      
      # Network
      - --host-allowlist=*
      - --min-gas-price=0
      
      # Data path (IMPORTANT)
      # Tại sao: Besu cần biết nơi lưu blockchain data
      - --data-path=/opt/besu/data
      
      # Logging (optional - helps debug)
      - --logging=INFO

volumes:
  besu-data:
    driver: local

